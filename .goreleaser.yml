version: 2

project_name: awless

before:
  hooks:
    - go mod tidy

builds:
  - env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on arm64 has no meaningful audience for this CLI.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w
      # The git tag is the single source of truth for a release version;
      # config.Version's literal is only the fallback for plain `go build`.
      - -X github.com/bootswithdefer/awless/config.Version=v{{ .Version }}
      - -X github.com/bootswithdefer/awless/config.buildDate={{ .Date }}
      - -X github.com/bootswithdefer/awless/config.buildSha={{ .FullCommit }}
      - -X github.com/bootswithdefer/awless/config.buildOS={{ .Os }}
      - -X github.com/bootswithdefer/awless/config.buildArch={{ .Arch }}
      # Matches the value release.go used for tar.gz artifacts; config.BuildFor
      # drives the upgrade instructions printed by the update check.
      - -X github.com/bootswithdefer/awless/config.BuildFor=targz

archives:
  - formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - README.md
      - LICENSE
      - CHANGELOG.md

checksum:
  name_template: checksums.txt
  algorithm: sha256

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"
      - "^chore:"
      - "^style:"
      - "^build:"

release:
  github:
    owner: bootswithdefer
    name: awless
  draft: false
  prerelease: auto

homebrew_casks:
  # A cask rather than a formula: Homebrew expects formulae to build from source and
  # pre-compiled binaries to ship as casks, and GoReleaser deprecated `brews`
  # accordingly. Install with `brew install --cask bootswithdefer/tap/awless`.
  - name: awless
    # The repository must be named homebrew-tap for `bootswithdefer/tap` to resolve;
    # brew expands the short form.
    repository:
      owner: bootswithdefer
      name: homebrew-tap
      branch: main
      # Pushed over SSH with a deploy key rather than with a token. The workflow's
      # GITHUB_TOKEN is scoped to this repository and cannot write to the tap, and a
      # personal access token with `repo` scope would grant write access to every
      # repository the owner has. A deploy key is limited to the tap alone.
      git:
        url: "git@github.com:bootswithdefer/homebrew-tap.git"
        private_key: "{{ .Env.HOMEBREW_TAP_SSH_KEY_PATH }}"
    directory: Casks
    binaries:
      - awless
    homepage: "https://github.com/bootswithdefer/awless"
    description: "A powerful CLI to manage AWS, with a template DSL, revertible actions and offline resource graphs"
    license: "Apache-2.0"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # macOS quarantines downloaded binaries; without this the first run is blocked by
    # Gatekeeper with no clear explanation.
    hooks:
      post:
        install: |
          if OS.mac?
            system "xattr", "-dr", "com.apple.quarantine", "#{staged_path}/awless"
          end

