name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Run tests with coverage
        run: go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./...

      - name: Coverage summary
        run: |
          go tool cover -func=coverage.out | tail -1
          go tool cover -func=coverage.out | grep -v "100.0%" | sort -t$'\t' -k3 -n | head -20

      - name: Upload coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

      - name: Update coverage badge
        if: github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: ncruces/go-coverage-report@dfc237255099f2d25066babde51253992175e365 # v0.3.2
        with:
          coverage-file: coverage.out
          report: true
          chart: true
          amend: true

  race:
    name: Race Detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Restored after being dropped in 6830d3d0. Its absence is why the
      # goroutine leaks and unbounded fan-out in the fetchers (B8/I13) went
      # unnoticed. Kept as a separate job so a race failure is distinguishable
      # from an ordinary test failure, and so it does not slow the main job.
      - name: Test with race detector
        run: go test -race -count=1 ./...

  codegen:
    name: Codegen Drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The generators shell out to goimports to prune the unused imports their
      # templates emit, so it has to be present.
      - name: Install goimports
        run: go install golang.org/x/tools/cmd/goimports@latest

      - name: Regenerate
        run: cd gen/aws/generators && go run *.go

      # Enforces the "never hand-edit gen_*.go" rule in AGENTS.md. Output is
      # deterministic, so any diff here means a definition or template changed
      # without the generated files being regenerated.
      - name: Check for drift
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run: make generate"
            exit 1
          fi

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Short runs only: enough to catch an obvious regression on every push
      # without turning CI into a fuzzing farm. The seed corpus and any
      # discovered crashers in template/testdata/fuzz are exercised by the
      # normal `test` job on every run.
      #
      # The template parser is the target because it consumes untrusted input:
      # `awless run` takes a local path or an HTTP URL, and the local log is
      # re-parsed on read.
      - name: Fuzz template parsing
        run: go test ./template/ -run=XXX -fuzz='^FuzzParse$' -fuzztime=60s

      - name: Fuzz statement parsing
        run: go test ./template/ -run=XXX -fuzz='^FuzzParseStatement$' -fuzztime=60s

  vuln:
    name: Vulnerability Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # Reports only vulnerabilities actually reachable from this code, not
      # every advisory affecting an imported module, so it is low-noise enough
      # to be a blocking job.
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      # Pinned deliberately: this job was broken by `@latest` moving to
      # golangci-lint v2, whose config format is incompatible with v1.
      # Keep in sync with the version developers install locally.
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2

      - name: golangci-lint
        run: golangci-lint run ./...

  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -o /dev/null .
