name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      # Required for GoReleaser to create the GitHub release and upload assets.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # GoReleaser derives the version and changelog from tag history.
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # GoReleaser takes a path to the key, not its contents, so the secret is written
      # to a file first. Kept out of the workspace so no archive glob can pick it up,
      # and mode 600 because ssh refuses a world-readable key.
      - name: Write the Homebrew tap deploy key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.HOMEBREW_TAP_SSH_KEY }}" > ~/.ssh/homebrew_tap
          chmod 600 ~/.ssh/homebrew_tap
          ssh-keyscan -t ed25519 github.com >> ~/.ssh/known_hosts

      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The cask is committed to bootswithdefer/homebrew-tap over SSH with a deploy
          # key scoped to that repository. GITHUB_TOKEN cannot reach another repository,
          # and a PAT with `repo` scope would grant write access to every repository the
          # owner has, which is far more than this needs.
          HOMEBREW_TAP_SSH_KEY_PATH: /home/runner/.ssh/homebrew_tap
