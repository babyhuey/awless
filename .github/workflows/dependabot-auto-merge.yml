name: Dependabot auto-merge

on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    # pull_request_target runs with repository write access, so gate strictly on
    # the actor. Only Dependabot's own PRs are eligible.
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch update metadata
        id: meta
        uses: dependabot/fetch-metadata@08eff52bf64351f401fb50d4972fa95b9f2c2d1b # v2.4.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # Patch and minor only. Majors are held for review because they can carry
      # breaking changes, which is exactly how go-git v4 and boltdb went stale.
      #
      # Auto-merge waits for required status checks, so CI still has to pass;
      # this only removes the manual click.
      - name: Enable auto-merge
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
