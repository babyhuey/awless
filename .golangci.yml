version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    # Added incrementally (ISSUES.md I9).
    - bodyclose
    - errcheck
    - errorlint
    - nilerr
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        # 'inline' is a recently added analyzer that enable-all picks up. It is
        - inline # noisy suggestions to inline constants; go vet does not run it
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1019 # deprecated usage - too noisy for a migration
        # golangci-lint v2 merged gosimple and stylecheck into staticcheck.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bootswithdefer/awless
  exclusions:
    generated: lax
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
