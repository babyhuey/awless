version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    # Added incrementally (ISSUES.md I9).
    - bodyclose
    - errcheck
    - errorlint
    - nilerr
    - noctx          # HTTP requests must carry a context
    - copyloopvar    # redundant copy of a loop variable (Go 1.22+)
    - errname        # error vars named ErrFoo, error types FooError
    - exhaustive     # a switch over an enum missing cases
    - fatcontext     # a context created inside a loop
    - intrange       # for i := range n instead of a three-clause loop
    - mirror         # the []byte variant where a string one avoids an allocation
    - musttag        # structs crossing a serialization boundary need explicit tags
    - predeclared    # shadowing a predeclared identifier
    - thelper        # test helpers should call t.Helper()
    # dupword is deliberately absent. All three findings were false positives: a
    # repeated word inside an embedded zsh script, a "very:very:very" test fixture,
    # and a template literal that legitimately reads "none none". Configuring
    # ignore-words for test data would not leave anything worth catching.
    #
    # unparam is deliberately absent too, but it was worth running once: it found
    # five genuinely dead parameters, since fixed. Of the fifteen findings, four were
    # fluent builder methods in template/internal/ast whose unused return value is
    # the point of the pattern, and three were params that happen to receive one
    # value today but exist to be varied. Keeping it as a gate would mean suppressing
    # a legitimate builder API.
    # Report nothing today, so they cost nothing and guard against regressions.
    - asasalint       # []any passed to a variadic func
    - asciicheck      # non-ASCII characters in identifiers
    - bidichk         # bidirectional Unicode that renders unlike it compiles
    - canonicalheader # non-canonical HTTP header keys
    - contextcheck    # a function should inherit its caller's context
    - decorder        # declaration order and count within a file
    - durationcheck   # multiplying two durations
    - errchkjson      # unchecked json.Marshal errors, and checks that cannot fail
    - exptostd        # golang.org/x/exp code now in the standard library
    - gocheckcompilerdirectives # a malformed //go: directive, silently ignored
    - gosmopolitan    # locale-dependent string handling
    - iface           # redundant or unused interfaces
    - iotamixing      # iota mixed with explicit values in one const block
    - loggercheck     # key/value pairs in structured log calls
    - makezero        # slice made with a length then appended to
    - nilnesserr      # returns an error that is always nil
    - nolintlint      # a //nolint must be specific and explained
    - nosprintfhostport # Sprintf building a host:port, which breaks on IPv6
    - protogetter     # protobuf field access instead of a getter
    - reassign        # assigning to another package's variable
    - recvcheck       # mixed pointer and value receivers on one type
    - rowserrcheck    # unchecked sql.Rows.Err
    - spancheck       # unended OpenTelemetry spans
    - sqlclosecheck   # unclosed sql.Rows / sql.Stmt
    - testableexamples # Example functions without verifiable output
    - tparallel       # inconsistent t.Parallel between a test and its subtests
    - unqueryvet      # SELECT * in a query
    - usestdlibvars   # stdlib constants instead of literals
    - wastedassign    # a value assigned and never used
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        # 'inline' is a recently added analyzer that enable-all picks up. It is
        - inline # noisy suggestions to inline constants; go vet does not run it
    misspell:
      locale: US
    exhaustive:
      # Every switch flagged here handles a few interesting cases and falls back to
      # a default — enumerating all 26 reflect.Kind values would be worse code, not
      # better. A default is the author saying the switch is deliberately partial.
      default-signifies-exhaustive: true
    staticcheck:
      checks:
        - all
        - -SA1019 # deprecated usage - too noisy for a migration
        # golangci-lint v2 merged gosimple and stylecheck into staticcheck.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bootswithdefer/awless
  exclusions:
    generated: lax
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
