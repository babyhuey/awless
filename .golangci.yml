version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    # Added incrementally (ISSUES.md I9).
    - bodyclose
    - errcheck
    - errorlint
    - nilerr
    # Report nothing today, so they cost nothing and guard against regressions.
    - asasalint       # []any passed to a variadic func
    - contextcheck    # a function should inherit its caller's context
    - durationcheck   # multiplying two durations
    - iotamixing      # iota mixed with explicit values in one const block
    - makezero        # slice made with a length then appended to
    - nilnesserr      # returns an error that is always nil
    - nolintlint      # a //nolint must be specific and explained
    - reassign        # assigning to another package's variable
    - recvcheck       # mixed pointer and value receivers on one type
    - sqlclosecheck   # unclosed sql.Rows / sql.Stmt
    - usestdlibvars   # stdlib constants instead of literals
    - wastedassign    # a value assigned and never used
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        # 'inline' is a recently added analyzer that enable-all picks up. It is
        - inline # noisy suggestions to inline constants; go vet does not run it
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1019 # deprecated usage - too noisy for a migration
        # golangci-lint v2 merged gosimple and stylecheck into staticcheck.
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bootswithdefer/awless
  exclusions:
    generated: lax
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
