version: "2"

linters:
  default: none
  enable:
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unconvert
    - unused
    # Added incrementally (ISSUES.md I9). errcheck (166 findings) and errorlint
    # (41) are still pending; see I9 for the ordering.
    - bodyclose
    - nilerr
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
        - shadow
        # 'inline' is a recently added analyzer that enable-all picks up. It is
        # not part of stock `go vet`, which CI runs separately and passes.
        # 16 findings, all reflect.Ptr -> reflect.Pointer. Tracked as ISSUES.md
        # I19; re-enable once that lands.
        - inline
    misspell:
      locale: US
    staticcheck:
      checks:
        - all
        - -SA1019 # deprecated usage - too noisy for a migration
        # golangci-lint v2 merged gosimple and stylecheck into staticcheck.
        # v1 enabled gosimple + staticcheck but NOT stylecheck, so ST* and QF*
        # checks never ran here. Excluded to keep this a behaviour-preserving
        # migration: enabling them adds 255 findings. Tracked as ISSUES.md I19.
        - -ST*
        - -QF*
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 5
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/bootswithdefer/awless
  exclusions:
    generated: lax
    paths:
      - gen_.*\.go$
      - awless-template-syntax\.peg\.go$
      - vendor
      - third_party$
      - builtin$
      - examples$
